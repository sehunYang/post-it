<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://*.firebasedatabase.app https://*.firebaseio.com; style-src 'self'; img-src 'self' data:; connect-src https://*.googleapis.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.firebaseio.com wss://*.firebaseio.com http://127.0.0.1:9099 http://127.0.0.1:9000 ws://127.0.0.1:9000">
<meta name="color-scheme" content="light dark">
<title>Post-it</title>
<link rel="stylesheet" href="widget.css">
</head>
<body>
<article id="card" class="card is-loading" aria-label="Post-it 위젯">
  <header class="bar">
    <button id="btn-collapse" class="tool collapse" type="button" title="접기" aria-label="접기" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <span class="brand"><i id="dot" class="dot" aria-hidden="true"></i>Post-it</span>
    <!-- 접었을 때 고정한 글의 첫 줄 -->
    <span id="peek" class="peek"></span>
    <div class="tools">
      <button id="btn-new" class="tool" type="button" title="새 글 쓰기 (저장하면 위젯에 고정)" aria-label="새 글 쓰기" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="btn-save-clip" class="tool" type="button" title="지금 클립보드를 새 글로 저장" aria-label="지금 클립보드를 새 글로 저장" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M8 5.5H6.5A1.5 1.5 0 0 0 5 7v12.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V7a1.5 1.5 0 0 0-1.5-1.5H16"/><path d="M12 10.5v6M9 13.5h6"/></svg>
      </button>
      <button id="btn-web" class="tool" type="button" title="웹앱 열기" aria-label="웹앱 열기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5"/><path d="M19 5l-8 8"/><path d="M17 14v4.5A1.5 1.5 0 0 1 15.5 20h-10A1.5 1.5 0 0 1 4 18.5v-10A1.5 1.5 0 0 1 5.5 7H10"/></svg>
      </button>
      <button id="btn-hide" class="tool" type="button" title="위젯 숨기기 (트레이 아이콘으로 다시 켭니다)" aria-label="위젯 숨기기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </header>

  <!-- 로그인 전 -->
  <section id="signed-out" class="pane" hidden>
    <p class="hint">웹앱·폰과 같은 Google 계정으로 로그인하면 고정한 글이 여기에 뜹니다.</p>
    <button id="btn-signin" class="primary" type="button">Google 계정으로 로그인</button>
  </section>

  <!-- 로그인 후: 고정한 글을 바로 고쳐 씁니다. 멈추면 저장됩니다. -->
  <section id="editor" class="editor" hidden>
    <textarea id="note-input" class="note-input" spellcheck="false" aria-label="고정한 글"
      placeholder="여기에 적으면 저장되고 위젯에 고정됩니다.&#10;사진·파일은 Ctrl+V 나 끌어다 놓기로 올립니다."></textarea>
  </section>

  <!-- 고정한 글이 사진·파일이면: 미리보기와 파일 이름·크기. 고쳐 쓸 수 없고 복사만 됩니다. -->
  <section id="attach" class="attach" tabindex="0" aria-label="고정한 사진·파일" hidden>
    <img id="attach-thumb" class="attach-thumb" alt="" hidden>
    <ul id="attach-list" class="attach-list" aria-label="첨부 파일"></ul>
  </section>

  <footer class="foot">
    <span id="status" class="status" role="status" aria-live="polite">불러오는 중…</span>
    <button id="btn-copy" class="copy" type="button" title="클립보드로 복사" hidden>복사</button>
  </footer>
</article>
<script type="module" src="../../dist/widget.js"></script>
</body>
</html>
