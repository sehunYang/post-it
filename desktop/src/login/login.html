<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Post-it 데스크톱 로그인</title>
<style>
  :root{--bg:#f7f7f4;--surface:#fff;--text:#171717;--muted:#666;--line:#d9d9d4;--accent:#2563eb;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#111210;--surface:#191a18;--text:#f2f2ed;--muted:#a8aaa2;--line:#343630;--accent:#7db1ff;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
    font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif;line-height:1.7;letter-spacing:-.01em;word-break:keep-all}
  main{width:min(460px,calc(100vw - 32px));padding:2.2rem;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
  .eyebrow{margin:0;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:800;color:var(--accent)}
  h1{margin:.4rem 0 .8rem;font-size:1.7rem;line-height:1.25;letter-spacing:-.04em}
  p{margin:0 0 1.4rem;color:var(--muted)}
  button{font:inherit;font-weight:600;padding:.75rem 1.3rem;border:0;border-radius:999px;background:var(--accent);color:#fff;cursor:pointer}
  @media (prefers-color-scheme:dark){button{color:#0d1420}}
  button:disabled{opacity:.5;cursor:default}
  #status{margin:1.2rem 0 0;min-height:1.7em;color:var(--text)}
  .done h1{color:var(--accent)}
</style>
</head>
<body>
<main id="box">
  <p class="eyebrow">Desktop Widget</p>
  <h1 id="title">위젯을 Google 계정에 연결합니다</h1>
  <p id="lede">웹앱과 폰에서 쓰는 것과 같은 계정을 고르세요. 로그인이 끝나면 이 탭은 닫아도 됩니다.</p>
  <button id="go" type="button">Google 계정으로 로그인</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>window.__POSTIT_BOOT__ = /*BOOT*/null;</script>
<script type="module" src="/login.js"></script>
</body>
</html>
